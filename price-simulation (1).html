<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料金シミュレーション | BONNY TRANSPORT（ボニー運送）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E7692C;
    --orange-soft: rgba(231, 105, 44, 0.12);
    --black: #191919;
    --cream: #FFF8F3;
    --gray: #59564F;
    --border: #EBDED4;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--black);
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  img { display: block; max-width: 100%; }

  /* ---------- Header ---------- */
  header { position: sticky; top: 0; z-index: 50; background: var(--cream); border-bottom: 1px solid var(--border); }

  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; max-width: 1280px; margin: 0 auto;
  }

  .logo img { height: 52px; width: auto; }

  nav.main-nav { display: flex; gap: 26px; }
  nav.main-nav a { font-weight: 700; font-size: 14px; color: var(--black); white-space: nowrap; transition: color 0.2s ease; }
  nav.main-nav a:hover { color: var(--orange); }
  nav.main-nav a.is-active { color: var(--orange); }

  .nav-toggle { display: none; flex-direction: column; gap: 5px; padding: 8px; }
  .nav-toggle span { width: 24px; height: 2px; background: var(--black); }

  /* ---------- Title band ---------- */
  .title-band {
    position: relative; overflow: hidden;
    padding: 60px 24px 32px; text-align: center;
  }

  .title-band::before {
    content: ""; position: absolute; top: -180px; right: -140px;
    width: 420px; height: 420px; border-radius: 50%; background: var(--orange-soft);
  }

  .title-band::after {
    content: ""; position: absolute; bottom: -140px; left: -100px;
    width: 300px; height: 300px; border-radius: 50%; background: var(--orange-soft);
  }

  .title-band h1 {
    position: relative;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 5vw, 44px);
    margin-bottom: 10px;
  }

  .title-band p { position: relative; color: var(--gray); font-size: 15px; }

  /* ---------- Direction toggle ---------- */
  .direction-toggle {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 8px 24px 40px;
    flex-wrap: wrap;
  }

  .direction-btn {
    padding: 14px 34px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--black);
    transition: all 0.2s ease;
  }

  .direction-btn.is-active {
    background: var(--black);
    color: var(--orange);
    border-color: var(--black);
  }

  /* ---------- Simulator ---------- */
  .simulator-wrap { max-width: 720px; margin: 0 auto; padding: 0 24px 100px; }

  .sim-panel { display: none; }
  .sim-panel.is-active { display: block; }

  /* progress dots */
  .progress { display: flex; justify-content: center; gap: 10px; margin-bottom: 36px; }

  .progress .dot {
    width: 34px; height: 6px; border-radius: 999px;
    background: var(--border);
    transition: background 0.25s ease;
  }

  .progress .dot.is-done { background: var(--orange); }
  .progress .dot.is-current { background: var(--black); }

  .question-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    padding: 40px 36px;
  }

  .q-illustration { display: none; }

  @media (min-width: 768px) {
    .question-card { display: flex; align-items: center; gap: 44px; }
    .q-content { flex: 1; min-width: 0; }
    .q-illustration {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 190px;
      height: 190px;
      border-radius: 24px;
      background: var(--orange-soft);
    }
    .q-illustration svg { width: 118px; height: 118px; }
  }

  .q-step-label {
    display: inline-block;
    background: var(--orange-soft);
    color: var(--orange);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .q-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 21px;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .q-subtitle { font-size: 14px; color: var(--gray); margin-bottom: 26px; }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    font-size: 16px;
    font-weight: 500;
    color: var(--black);
    background: var(--cream);
    transition: all 0.15s ease;
  }

  .option-btn:hover { border-color: var(--orange); background: var(--orange-soft); }

  .option-btn .marker {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--white);
    display: flex; align-items: center; justify-content: center;
  }

  .option-btn.multi.is-selected {
    border-color: var(--orange);
    background: var(--orange-soft);
  }

  .option-btn.multi.is-selected .marker {
    background: var(--orange);
    border-color: var(--orange);
  }

  .option-btn.multi.is-selected .marker::after {
    content: "";
    width: 6px; height: 10px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .option-btn.single .marker { border-radius: 999px; }

  .step-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }

  .btn-back {
    font-weight: 700; font-size: 14px; color: var(--gray);
    padding: 10px 6px;
  }

  .btn-back:hover { color: var(--black); }

  .btn-next {
    background: var(--black);
    color: var(--orange);
    font-weight: 700;
    font-size: 15px;
    padding: 14px 32px;
    border-radius: 999px;
  }

  .btn-next[disabled] { opacity: 0.35; cursor: not-allowed; }

  /* ---------- Date question ---------- */
  .date-picker {
    margin-top: 18px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  .date-picker label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .date-picker input[type="date"] {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--cream);
    color: var(--black);
    margin-bottom: 18px;
  }

  .date-picker input[type="date"]:focus { outline: none; border-color: var(--orange); }

  /* ---------- Result ---------- */
  .result-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    padding: 48px 36px;
    text-align: center;
  }

  .result-card .badge {
    display: inline-block;
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 20px;
  }

  .result-card h2 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: 22px;
    margin-bottom: 20px;
  }

  .result-price {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    color: var(--orange);
    font-size: clamp(40px, 8vw, 56px);
    margin-bottom: 6px;
  }

  .result-price .yen { font-size: 0.5em; margin-right: 4px; }
  .result-note { font-size: 13px; color: var(--gray); margin-bottom: 32px; }

  .result-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .btn-primary {
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 15px;
    padding: 14px 30px;
    border-radius: 999px;
  }

  .btn-secondary {
    background: var(--cream);
    color: var(--black);
    border: 1.5px solid var(--border);
    font-weight: 700;
    font-size: 15px;
    padding: 14px 30px;
    border-radius: 999px;
  }

  .result-panel { display: none; }
  .result-panel.is-active { display: block; }

  /* ---------- Footer ---------- */
  footer { background: var(--black); color: var(--cream); padding: 60px 24px 40px; }
  .footer-inner { max-width: 1280px; margin: 0 auto; }

  .footer-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 24px; margin-bottom: 44px; }
  .footer-logo { background: var(--white); border-radius: 12px; padding: 12px; display: inline-flex; }
  .footer-logo img { height: 50px; width: auto; }

  .footer-cta { background: var(--orange); color: var(--white); font-weight: 700; font-size: 17px; padding: 14px 30px; border-radius: 999px; }

  .footer-links { display: flex; gap: 80px; flex-wrap: wrap; margin-bottom: 40px; }
  .footer-col h3 { font-family: 'Zen Maru Gothic', sans-serif; color: var(--orange); font-size: 18px; margin-bottom: 14px; }
  .footer-col a { display: block; font-size: 15px; opacity: 0.85; padding: 6px 0; }
  .footer-col a:hover { opacity: 1; color: var(--orange); }

  .footer-bottom { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 24px; font-size: 13px; opacity: 0.55; }

  @media (max-width: 900px) {
    nav.main-nav { display: none; }
    .nav-toggle { display: flex; }
  }

  @media (max-width: 560px) {
    .question-card { padding: 30px 22px; }
    .result-card { padding: 36px 22px; }
  }
</style>
</head>

<script>
/* =========================================================
   Data — shared option sets, per direction wording differs
   Prices are intentionally never rendered until the final
   result screen (per spec: no running total shown mid-flow).
========================================================= */
const BASE_PRICE = 15000;

const AREA_OPTIONS = [
  { label: "北海道エリア", price: 520000 },
  { label: "東北エリア", price: 350000 },
  { label: "関東、北信越エリア", price: 215000 },
  { label: "近畿、東海エリア", price: 200000 },
  { label: "中国、四国エリア", price: 100000 },
  { label: "九州エリア", price: 55000 },
  { label: "福岡県内", price: 0 },
];

const VOLUME_OPTIONS = [
  { label: "単身", price: 0 },
  { label: "二人暮らし", price: 10000 },
  { label: "3人以上ファミリー", price: 15000 },
];

const CURRENT_FLOOR_OPTIONS = [
  { label: "エレベーターあり", price: 0 },
  { label: "エレベーターなし（1F）", price: 0 },
  { label: "エレベーターなし（2F）", price: 1000 },
  { label: "エレベーターなし（3F）", price: 3000 },
  { label: "エレベーターなし（4F）", price: 5000 },
  { label: "エレベーターなし（5F）", price: 5000 },
];

const NEW_FLOOR_OPTIONS = [
  { label: "エレベーターあり", price: 0 },
  { label: "エレベーターなし（1F）", price: 0 },
  { label: "エレベーターなし（2F）", price: 2000 },
  { label: "エレベーターなし（3F）", price: 5000 },
  { label: "エレベーターなし（4F）", price: 10000 },
  { label: "エレベーターなし（5F）", price: 10000 },
];

// Q5 special option key
const STOPOVER_KEY = "stopover";

// Peak season: March 1 – April 15 (any year), regardless of the year chosen.
function isPeakDate(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + "T00:00:00");
  const month = d.getMonth() + 1; // 1-12
  const day = d.getDate();
  if (month === 3) return true;
  if (month === 4 && day <= 15) return true;
  return false;
}

/* Simple flat illustrations, one per question, shown only on desktop
   widths (see .q-illustration in the CSS). Colors follow the brand
   palette (orange / black) used throughout the site. */
const QUESTION_ILLUSTRATIONS = [
  // Q0: moving date — calendar
  `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="26" width="80" height="72" rx="10" fill="#191919"/>
    <rect x="20" y="26" width="80" height="22" rx="10" fill="#E7692C"/>
    <rect x="36" y="16" width="8" height="20" rx="4" fill="#191919"/>
    <rect x="76" y="16" width="8" height="20" rx="4" fill="#191919"/>
    <rect x="32" y="60" width="14" height="14" rx="3" fill="#FFF8F3"/>
    <rect x="53" y="60" width="14" height="14" rx="3" fill="#FFF8F3"/>
    <rect x="74" y="60" width="14" height="14" rx="3" fill="#E7692C"/>
    <rect x="32" y="80" width="14" height="14" rx="3" fill="#FFF8F3"/>
  </svg>`,
  // Q1: destination / origin area — map pin + route
  `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M60 14C44 14 32 26 32 42C32 64 60 96 60 96C60 96 88 64 88 42C88 26 76 14 60 14Z" fill="#E7692C"/>
    <circle cx="60" cy="42" r="14" fill="#FFF8F3"/>
    <path d="M18 100C30 92 48 92 60 100C72 108 90 108 102 100" stroke="#191919" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12"/>
  </svg>`,
  // Q2: household volume — stacked moving boxes
  `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="56" width="40" height="36" rx="4" fill="#191919"/>
    <path d="M20 66H60" stroke="#FFF8F3" stroke-width="3"/>
    <path d="M40 56V92" stroke="#FFF8F3" stroke-width="3"/>
    <rect x="56" y="34" width="46" height="40" rx="4" fill="#E7692C"/>
    <path d="M56 46H102" stroke="#FFF8F3" stroke-width="3"/>
    <path d="M79 34V74" stroke="#FFF8F3" stroke-width="3"/>
  </svg>`,
  // Q3: current residence — building with elevator shaft
  `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="20" width="64" height="80" rx="6" fill="#191919"/>
    <rect x="40" y="32" width="16" height="16" rx="2" fill="#FFF8F3"/>
    <rect x="64" y="32" width="16" height="16" rx="2" fill="#FFF8F3"/>
    <rect x="40" y="56" width="16" height="16" rx="2" fill="#FFF8F3"/>
    <rect x="64" y="56" width="16" height="16" rx="2" fill="#E7692C"/>
    <rect x="46" y="80" width="28" height="20" rx="2" fill="#FFF8F3"/>
  </svg>`,
  // Q4: new residence — building with an upward arrow (moving in)
  `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="24" y="34" width="56" height="66" rx="6" fill="#191919"/>
    <rect x="34" y="46" width="14" height="14" rx="2" fill="#FFF8F3"/>
    <rect x="56" y="46" width="14" height="14" rx="2" fill="#FFF8F3"/>
    <rect x="34" y="68" width="14" height="14" rx="2" fill="#FFF8F3"/>
    <rect x="44" y="86" width="16" height="14" rx="2" fill="#FFF8F3"/>
    <path d="M92 66L92 22M92 22L78 36M92 22L106 36" stroke="#E7692C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`,
  // Q5: paid options — toolbox with a plus badge
  `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="18" y="52" width="84" height="42" rx="8" fill="#E7692C"/>
    <path d="M42 52V42C42 36 46 32 52 32H68C74 32 78 36 78 42V52" stroke="#191919" stroke-width="6" fill="none"/>
    <rect x="18" y="68" width="84" height="10" fill="#191919"/>
    <circle cx="88" cy="34" r="16" fill="#191919"/>
    <path d="M88 27V41M81 34H95" stroke="#FFF8F3" stroke-width="3.5" stroke-linecap="round"/>
  </svg>`,
];

function buildOptionsQ5(includeNone) {
  const opts = [
    { key: "junk", label: "不用品回収廃棄", price: 5000 },
    { key: "packing", label: "梱包お手伝い", price: 30000 },
    { key: "butsudan", label: "仏壇仏具搬送", price: 20000 },
    { key: "lift", label: "吊り上げ吊り下ろし作業", price: 10000 },
    { key: STOPOVER_KEY, label: "立ち寄り（二箇所以上での積み込み・積み下ろし）", price: null }, // computed dynamically
  ];
  if (includeNone) opts.push({ key: "none", label: "特になし", price: 0 });
  return opts;
}

function makeFlow(direction) {
  const isDeparture = direction === "departure";
  return {
    id: direction,
    questions: [
      {
        label: "質問1",
        title: "引越しの日程は決まっていますか？",
        subtitle: "",
        type: "date",
        options: [
          { key: "undecided", label: "日程未定" },
          { key: "decided", label: "日程確定" },
        ],
      },
      {
        label: "質問2",
        title: isDeparture ? "引越し先はどちらですか？" : "どちらからのお引越しですか？",
        subtitle: "",
        type: "single",
        options: AREA_OPTIONS,
      },
      {
        label: "質問3",
        title: "お荷物の量はどのくらいですか？",
        subtitle: "",
        type: "single",
        options: VOLUME_OPTIONS,
      },
      {
        label: "質問4",
        title: "現在のご住宅にエレベーターはありますか？",
        subtitle: "またない場合は何階にお住まいですか？",
        type: "single",
        options: CURRENT_FLOOR_OPTIONS,
      },
      {
        label: "質問5",
        title: "新しいご住宅にエレベーターはありますか？",
        subtitle: "またない場合は何階にお引越しですか？",
        type: "single",
        options: NEW_FLOOR_OPTIONS,
      },
      {
        label: "質問6",
        title: "有料オプションのご利用予定はありますか？",
        subtitle: "あてはまるものをすべてお選びください（複数選択可）",
        type: "multi",
        options: buildOptionsQ5(true),
      },
    ],
    // index 0: date answer object { decided, date, peak } or { decided:false }
    // index 1-4: single select index. index 5: multi select array.
    answers: [null, null, null, null, null, []],
  };
}

const flows = {
  departure: makeFlow("departure"),
  arrival: makeFlow("arrival"),
};

/* =========================================================
   Rendering
========================================================= */
function renderFlow(flow) {
  const container = document.getElementById("sim-" + flow.id);
  container.innerHTML = "";

  // progress dots
  const progress = document.createElement("div");
  progress.className = "progress";
  for (let i = 0; i < flow.questions.length; i++) {
    const dot = document.createElement("div");
    dot.className = "dot";
    progress.appendChild(dot);
  }
  container.appendChild(progress);

  // question panels
  flow.questions.forEach((q, qIndex) => {
    const panel = document.createElement("div");
    panel.className = "question-panel";
    panel.dataset.index = qIndex;
    panel.style.display = "none";

    const card = document.createElement("div");
    card.className = "question-card";

    const content = document.createElement("div");
    content.className = "q-content";

    const stepLabel = document.createElement("span");
    stepLabel.className = "q-step-label";
    stepLabel.textContent = q.label + " / " + flow.questions.length;
    content.appendChild(stepLabel);

    const title = document.createElement("div");
    title.className = "q-title";
    title.textContent = q.title;
    content.appendChild(title);

    if (q.subtitle) {
      const subtitle = document.createElement("div");
      subtitle.className = "q-subtitle";
      subtitle.textContent = q.subtitle;
      content.appendChild(subtitle);
    } else {
      const spacer = document.createElement("div");
      spacer.style.marginBottom = "26px";
      content.appendChild(spacer);
    }

    const optionsWrap = document.createElement("div");
    optionsWrap.className = "options";

    if (q.type === "date") {
      const undecidedBtn = document.createElement("button");
      undecidedBtn.type = "button";
      undecidedBtn.className = "option-btn single";
      undecidedBtn.innerHTML = '<span class="marker"></span><span>日程未定</span>';
      undecidedBtn.addEventListener("click", () => {
        flow.answers[qIndex] = { decided: false };
        goToStep(flow, qIndex + 1);
      });

      const decidedBtn = document.createElement("button");
      decidedBtn.type = "button";
      decidedBtn.className = "option-btn single";
      decidedBtn.innerHTML = '<span class="marker"></span><span>日程確定</span>';

      const datePicker = document.createElement("div");
      datePicker.className = "date-picker";
      datePicker.style.display = "none";
      datePicker.innerHTML = `
        <label>引越し予定日を選択してください</label>
        <input type="date" class="date-input">
      `;
      const dateNextBtn = document.createElement("button");
      dateNextBtn.type = "button";
      dateNextBtn.className = "btn-next";
      dateNextBtn.textContent = "この日程で進む";
      dateNextBtn.disabled = true;
      datePicker.appendChild(dateNextBtn);

      const dateInput = datePicker.querySelector(".date-input");
      dateInput.addEventListener("change", () => {
        dateNextBtn.disabled = !dateInput.value;
      });

      decidedBtn.addEventListener("click", () => {
        datePicker.style.display = datePicker.style.display === "none" ? "block" : "none";
      });

      dateNextBtn.addEventListener("click", () => {
        if (!dateInput.value) return;
        flow.answers[qIndex] = {
          decided: true,
          date: dateInput.value,
          peak: isPeakDate(dateInput.value),
        };
        goToStep(flow, qIndex + 1);
      });

      optionsWrap.appendChild(undecidedBtn);
      optionsWrap.appendChild(decidedBtn);
      optionsWrap.appendChild(datePicker);
      content.appendChild(optionsWrap);
    } else {

    q.options.forEach((opt, optIndex) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn " + (q.type === "multi" ? "multi" : "single");
      const marker = document.createElement("span");
      marker.className = "marker";
      const text = document.createElement("span");
      text.textContent = opt.label;
      btn.appendChild(marker);
      btn.appendChild(text);

      btn.addEventListener("click", () => {
        if (q.type === "single") {
          flow.answers[qIndex] = optIndex;
          goToStep(flow, qIndex + 1);
        } else {
          const key = opt.key;
          const selected = flow.answers[qIndex];
          const pos = selected.indexOf(key);

          if (key === "none") {
            // selecting "特になし" clears everything else
            flow.answers[qIndex] = pos === -1 ? ["none"] : [];
          } else {
            // selecting any real option clears "none" if present
            const withoutNone = selected.filter((k) => k !== "none");
            if (pos === -1) {
              withoutNone.push(key);
            } else {
              withoutNone.splice(withoutNone.indexOf(key), 1);
            }
            flow.answers[qIndex] = withoutNone;
          }

          // sync visuals for every option button in this question
          const selectedNow = flow.answers[qIndex];
          optionsWrap.querySelectorAll(".option-btn.multi").forEach((b, i) => {
            const bKey = q.options[i].key;
            b.classList.toggle("is-selected", selectedNow.indexOf(bKey) !== -1);
          });
        }
      });

      optionsWrap.appendChild(btn);
    });

    content.appendChild(optionsWrap);

    }

    if (q.type === "multi") {
      const actions = document.createElement("div");
      actions.className = "step-actions";

      const back = document.createElement("button");
      back.type = "button";
      back.className = "btn-back";
      back.textContent = "← 戻る";
      back.addEventListener("click", () => goToStep(flow, qIndex - 1));

      const next = document.createElement("button");
      next.type = "button";
      next.className = "btn-next";
      next.textContent = "結果を見る";
      next.addEventListener("click", () => showResult(flow));

      actions.appendChild(back);
      actions.appendChild(next);
      content.appendChild(actions);
    } else if (qIndex > 0) {
      const actions = document.createElement("div");
      actions.className = "step-actions";
      const back = document.createElement("button");
      back.type = "button";
      back.className = "btn-back";
      back.textContent = "← 戻る";
      back.addEventListener("click", () => goToStep(flow, qIndex - 1));
      actions.appendChild(back);
      content.appendChild(actions);
    }

    const illustration = document.createElement("div");
    illustration.className = "q-illustration";
    illustration.innerHTML = QUESTION_ILLUSTRATIONS[qIndex];

    card.appendChild(content);
    card.appendChild(illustration);
    panel.appendChild(card);
    container.appendChild(panel);
  });

  // result panel
  const resultPanel = document.createElement("div");
  resultPanel.className = "result-panel";
  resultPanel.innerHTML = `
    <div class="result-card">
      <span class="badge">SIMULATION RESULT</span>
      <h2>概算のお引越し料金</h2>
      <div class="result-price"><span class="yen">¥</span><span class="result-amount">0</span></div>
      <p class="result-note">※こちらは概算料金です。正式なお見積もりはお電話・フォームにて承ります。</p>
      <p class="result-note peak-note" style="display:none; color: var(--orange); font-weight: 700;">※繁忙期は特別価格になりますので金額の変動がございます</p>
      <div class="result-actions">
        <a class="btn-primary" href="#">この内容をメールで問い合わせる</a>
        <button type="button" class="btn-secondary btn-restart">もう一度診断する</button>
      </div>
    </div>
  `;
  resultPanel.querySelector(".btn-restart").addEventListener("click", () => restartFlow(flow));
  container.appendChild(resultPanel);

  goToStep(flow, 0);
}

// Assigns stable data-key attributes to multi-select buttons so state can be
// re-synced (e.g. after navigating back and forward) via goToStep().
function decorateMultiButtons(flow) {
  flow.questions.forEach((q, qIndex) => {
    if (q.type !== "multi") return;
    const panel = document.querySelector('#sim-' + flow.id + ' .question-panel[data-index="' + qIndex + '"]');
    if (!panel) return;
    const buttons = panel.querySelectorAll(".option-btn.multi");
    buttons.forEach((btn, i) => {
      btn.dataset.key = q.options[i].key;
    });
  });
}

function goToStep(flow, index) {
  const container = document.getElementById("sim-" + flow.id);
  const panels = container.querySelectorAll(".question-panel");
  const resultPanel = container.querySelector(".result-panel");
  const dots = container.querySelectorAll(".progress .dot");

  resultPanel.classList.remove("is-active");

  panels.forEach((p) => {
    p.style.display = (parseInt(p.dataset.index, 10) === index) ? "block" : "none";
  });

  dots.forEach((dot, i) => {
    dot.classList.remove("is-current", "is-done");
    if (i < index) dot.classList.add("is-done");
    if (i === index) dot.classList.add("is-current");
  });

  // sync multi-select visuals when (re)entering question 5
  const q = flow.questions[index];
  if (q && q.type === "multi") {
    const panel = container.querySelector('.question-panel[data-index="' + index + '"]');
    const selected = flow.answers[index];
    panel.querySelectorAll(".option-btn.multi").forEach((btn) => {
      const isSelected = selected.indexOf(btn.dataset.key) !== -1;
      btn.classList.toggle("is-selected", isSelected);
    });
  }
}

function calculateTotal(flow) {
  const a = flow.answers;
  const q1 = AREA_OPTIONS[a[1]].price;
  const q2 = VOLUME_OPTIONS[a[2]].price;
  const q3 = CURRENT_FLOOR_OPTIONS[a[3]].price;
  const q4 = NEW_FLOOR_OPTIONS[a[4]].price;

  const subtotalThroughQ4 = BASE_PRICE + q1 + q2 + q3 + q4;
  let total = subtotalThroughQ4;

  const q5Options = flow.questions[5].options;
  a[5].forEach((key) => {
    if (key === "none") return;
    if (key === STOPOVER_KEY) {
      total += subtotalThroughQ4 * 1.5;
    } else {
      const opt = q5Options.find((o) => o.key === key);
      if (opt) total += opt.price;
    }
  });

  const dateAnswer = a[0];
  const isPeak = !!(dateAnswer && dateAnswer.decided && dateAnswer.peak);
  if (isPeak) total *= 1.5;

  return Math.round(total);
}

function formatDateJP(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

function buildAnswerSummary(flow) {
  const a = flow.answers;
  const directionLabel = flow.id === "departure" ? "福岡発" : "福岡着";
  const dateAnswer = a[0];
  const dateLabel = dateAnswer && dateAnswer.decided
    ? "確定（" + formatDateJP(dateAnswer.date) + "）"
    : "未定";
  const areaLabel = AREA_OPTIONS[a[1]].label;
  const volumeLabel = VOLUME_OPTIONS[a[2]].label;
  const currentFloorLabel = CURRENT_FLOOR_OPTIONS[a[3]].label;
  const newFloorLabel = NEW_FLOOR_OPTIONS[a[4]].label;
  const q5Options = flow.questions[5].options;
  const selectedOptionLabels = a[5]
    .filter((key) => key !== "none")
    .map((key) => {
      const opt = q5Options.find((o) => o.key === key);
      return opt ? opt.label : key;
    });
  const optionsLabel = selectedOptionLabels.length ? selectedOptionLabels.join(" / ") : "特になし";

  return {
    directionLabel, dateLabel, areaLabel, volumeLabel,
    currentFloorLabel, newFloorLabel, optionsLabel,
  };
}

function buildMailtoLink(flow, total, isPeak) {
  const s = buildAnswerSummary(flow);
  const areaQuestionLabel = flow.id === "departure" ? "引越し先" : "出発地";

  const lines = [
    "BONNY TRANSPORT 料金シミュレーション結果を添えて、お見積もりを依頼いたします。",
    "",
    "■シミュレーション結果",
    "区分：" + s.directionLabel,
    "引越し日程：" + s.dateLabel,
    areaQuestionLabel + "：" + s.areaLabel,
    "お荷物の量：" + s.volumeLabel,
    "現在のご住宅：" + s.currentFloorLabel,
    "新しいご住宅：" + s.newFloorLabel,
    "有料オプション：" + s.optionsLabel,
    "概算金額：¥" + total.toLocaleString("ja-JP") + (isPeak ? "（繁忙期特別価格を含む目安です）" : ""),
    "",
    "■お客様情報（下記をご記入の上、送信をお願いいたします）",
    "お名前：",
    "お電話番号：",
    "メールアドレス：",
    "現住所：",
    "新住所：",
    "その他ご要望・ご質問：",
  ];

  const subject = encodeURIComponent("【料金シミュレーション】お見積もりのご依頼");
  const body = encodeURIComponent(lines.join("\n"));
  return "mailto:bonny.transport0221@gmail.com?subject=" + subject + "&body=" + body;
}

function showResult(flow) {
  const container = document.getElementById("sim-" + flow.id);
  container.querySelectorAll(".question-panel").forEach((p) => (p.style.display = "none"));
  container.querySelectorAll(".progress .dot").forEach((dot) => dot.classList.add("is-done"));

  const total = calculateTotal(flow);
  const dateAnswer = flow.answers[0];
  const isPeak = !!(dateAnswer && dateAnswer.decided && dateAnswer.peak);
  const isUndecided = !!(dateAnswer && dateAnswer.decided === false);
  const showPeakNote = isPeak || isUndecided;

  const resultPanel = container.querySelector(".result-panel");
  resultPanel.querySelector(".result-amount").textContent = total.toLocaleString("ja-JP");
  resultPanel.querySelector(".peak-note").style.display = showPeakNote ? "block" : "none";
  resultPanel.querySelector(".btn-primary").href = buildMailtoLink(flow, total, isPeak);
  resultPanel.classList.add("is-active");
}

function restartFlow(flow) {
  flow.answers = [null, null, null, null, null, []];
  renderFlow(flow);
  decorateMultiButtons(flow);
}

/* =========================================================
   Init
========================================================= */
renderFlow(flows.departure);
renderFlow(flows.arrival);
decorateMultiButtons(flows.departure);
decorateMultiButtons(flows.arrival);

// Direction toggle
const btnDeparture = document.getElementById("btn-departure");
const btnArrival = document.getElementById("btn-arrival");
const simDeparture = document.getElementById("sim-departure");
const simArrival = document.getElementById("sim-arrival");

btnDeparture.addEventListener("click", () => {
  btnDeparture.classList.add("is-active");
  btnArrival.classList.remove("is-active");
  simDeparture.classList.add("is-active");
  simArrival.classList.remove("is-active");
});

btnArrival.addEventListener("click", () => {
  btnArrival.classList.add("is-active");
  btnDeparture.classList.remove("is-active");
  simArrival.classList.add("is-active");
  simDeparture.classList.remove("is-active");
});

// Mobile nav toggle
const navToggle = document.querySelector(".nav-toggle");
const mainNav = document.querySelector(".main-nav");
navToggle.addEventListener("click", () => {
  const isShown = mainNav.style.display === "flex";
  mainNav.style.display = isShown ? "none" : "flex";
  mainNav.style.cssText += isShown ? "" : "position:absolute; top:100%; left:0; right:0; background:var(--cream); flex-direction:column; padding:16px 24px; border-bottom:1px solid var(--border); gap:16px;";
});
</script>
