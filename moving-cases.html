<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引越し事例 | BONNY TRANSPORT（ボニー運送）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E7692C;
    --orange-soft: rgba(231, 105, 44, 0.12);
    --black: #191919;
    --cream: #FFF8F3;
    --gray: #59564F;
    --border: #EBDED4;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--black);
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  img { display: block; max-width: 100%; }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .logo img { height: 52px; width: auto; }

  nav.main-nav { display: flex; gap: 26px; }

  nav.main-nav a {
    font-weight: 700;
    font-size: 14px;
    color: var(--black);
    letter-spacing: 0.01em;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  nav.main-nav a:hover { color: var(--orange); }
  nav.main-nav a.is-active { color: var(--orange); }

  .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    padding: 8px;
  }

  .nav-toggle span { width: 24px; height: 2px; background: var(--black); }

  /* ---------- Title band ---------- */
  .title-band {
    position: relative;
    overflow: hidden;
    padding: 64px 24px 40px;
    text-align: center;
  }

  .title-band::before {
    content: "";
    position: absolute;
    top: -180px;
    right: -140px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: var(--orange-soft);
  }

  .title-band::after {
    content: "";
    position: absolute;
    bottom: -140px;
    left: -100px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: var(--orange-soft);
  }

  .title-band h1 {
    position: relative;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 5vw, 44px);
  }

  /* ---------- Coming soon ---------- */
  .coming-soon {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 24px 120px;
    text-align: center;
  }

  .coming-soon .icon-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 32px;
    border-radius: 50%;
    background: var(--white);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .coming-soon .icon-wrap svg { width: 60px; height: 40px; }

  .badge {
    display: inline-block;
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 14px;
    padding: 8px 22px;
    border-radius: 999px;
    margin-bottom: 24px;
  }

  .coming-soon h2 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: clamp(24px, 4vw, 32px);
    margin-bottom: 16px;
  }

  .coming-soon p {
    color: var(--gray);
    font-size: 16px;
    margin-bottom: 8px;
  }

  .coming-soon p.small {
    font-size: 14px;
    color: #9a958c;
    margin-top: 24px;
  }

  .back-link {
    display: inline-block;
    margin-top: 32px;
    padding: 14px 32px;
    background: var(--black);
    color: var(--orange);
    font-weight: 700;
    font-size: 15px;
    border-radius: 999px;
    transition: opacity 0.2s ease;
  }

  .back-link:hover { opacity: 0.85; }

  /* ---------- Footer ---------- */
  footer { background: var(--black); color: var(--cream); padding: 60px 24px 40px; }
  .footer-inner { max-width: 1280px; margin: 0 auto; }

  .footer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 44px;
  }

  .footer-logo { background: var(--white); border-radius: 12px; padding: 12px; display: inline-flex; }
  .footer-logo img { height: 50px; width: auto; }

  .footer-cta {
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 17px;
    padding: 14px 30px;
    border-radius: 999px;
  }

  .footer-links { display: flex; gap: 80px; flex-wrap: wrap; margin-bottom: 40px; }

  .footer-col h3 {
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--orange);
    font-size: 18px;
    margin-bottom: 14px;
  }

  .footer-col a { display: block; font-size: 15px; opacity: 0.85; padding: 6px 0; }
  .footer-col a:hover { opacity: 1; color: var(--orange); }

  .footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 24px;
    font-size: 13px;
    opacity: 0.55;
  }

  @media (max-width: 900px) {
    nav.main-nav { display: none; }
    .nav-toggle { display: flex; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html" aria-label="BONNY TRANSPORT トップページ">
      <img src="images/logo.jpg" alt="BONNY TRANSPORT（ボニー運送）">
    </a>
    <nav class="main-nav" aria-label="メインナビゲーション">
      <a href="index.html">引越し</a>
      <a href="price-simulation.html">価格シミュレーション</a>
      <a href="#" class="is-active" aria-current="page">引越し事例</a>
      <a href="light-transport.html">軽運送</a>
      <a href="faq.html">FAQ</a>
      <a href="company.html">会社概要</a>
    </nav>
    <button class="nav-toggle" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="title-band">
  <h1>引越し事例</h1>
</section>

<section class="coming-soon">
  <div class="icon-wrap">
    <svg viewBox="0 0 140 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="24" width="80" height="46" rx="10" fill="#E7692C"/>
      <path d="M84 38H112L134 60V70H84V38Z" fill="#191919"/>
      <rect x="92" y="46" width="26" height="16" rx="3" fill="#FFF8F3"/>
      <circle cx="34" cy="76" r="14" fill="#191919"/><circle cx="34" cy="76" r="6" fill="#FFF8F3"/>
      <circle cx="108" cy="76" r="14" fill="#191919"/><circle cx="108" cy="76" r="6" fill="#FFF8F3"/>
    </svg>
  </div>

  <span class="badge">COMING SOON</span>
  <h2>ただいま準備中です</h2>
  <p>お客様の引越し事例を、近日中にこちらのページでご紹介予定です。</p>
  <p>もうしばらくお待ちください。</p>
  <p class="small">お急ぎでご相談されたい方は、お電話またはお問い合わせフォームからお気軽にどうぞ。</p>

  <a class="back-link" href="index.html">トップページへ戻る</a>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-top">
      <div class="footer-logo"><img src="images/logo.jpg" alt="BONNY TRANSPORT"></div>
      <a class="footer-cta" href="#">無料お見積もり →</a>
    </div>

    <div class="footer-links">
      <div class="footer-col">
        <h3>引越し</h3>
        <a href="index.html#features">ボニー運送の特徴</a>
        <a href="#">引越しプラン</a>
        <a href="index.html#pricing">料金目安表</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div class="footer-col">
        <h3>軽運送</h3>
        <a href="#">軽運送とは</a>
        <a href="#">配送品の例</a>
        <a href="#">対応可能エリア</a>
        <a href="#">送料目安表</a>
      </div>
      <div class="footer-col">
        <h3>会社情報</h3>
        <a href="company.html#about">会社について</a>
        <a href="company.html#message">代表挨拶</a>
      </div>
    </div>

    <div class="footer-bottom">© BONNY TRANSPORT All Rights Reserved.</div>
  </div>
</footer>

<script>
  const navToggle = document.querySelector('.nav-toggle');
  const mainNav = document.querySelector('.main-nav');
  navToggle.addEventListener('click', () => {
    const isShown = mainNav.style.display === 'flex';
    mainNav.style.display = isShown ? 'none' : 'flex';
    mainNav.style.cssText += isShown ? '' : 'position:absolute; top:100%; left:0; right:0; background:var(--cream); flex-direction:column; padding:16px 24px; border-bottom:1px solid var(--border); gap:16px;';
  });
</script>

</body>
</html>
